<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>알림 설정</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5; display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .card {
      background: #fff; border-radius: 16px; padding: 32px 24px; text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12); width: 100%; max-width: 340px;
    }
    .icon { font-size: 56px; margin-bottom: 16px; }
    .title { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: #191F28; }
    .msg { font-size: 14px; color: #757575; margin-bottom: 24px; line-height: 1.6; }
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      font-size: 16px; font-weight: 600; cursor: pointer; background: #3182F6; color: #fff;
    }
    .btn:active { opacity: .85; }
    .steps { text-align: left; font-size: 14px; color: #4E5968; line-height: 2; }
    .steps b { color: #191F28; }
    .spinner {
      width: 40px; height: 40px; margin: 0 auto 16px;
      border: 4px solid #E0E0E0; border-top-color: #3182F6; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="card">
  <div id="view-loading" class="hidden">
    <div class="spinner"></div>
    <div class="title">처리 중</div>
    <div class="msg">잠시만 기다려 주세요...</div>
  </div>

  <div id="view-prompt" class="hidden">
    <div class="icon">🔔</div>
    <div class="title">알림 켜기</div>
    <div class="msg">출근/퇴근 체크 알림을 받으려면<br>아래 버튼을 눌러 허용해 주세요.</div>
    <button class="btn" onclick="enable()">알림 허용</button>
  </div>

  <div id="view-install" class="hidden">
    <div class="icon">📲</div>
    <div class="title">홈 화면에 추가하세요</div>
    <div class="msg">아이폰은 홈 화면에 추가한 뒤<br>거기서 열어야 알림을 받을 수 있어요.</div>
    <div class="steps">
      1. 하단 <b>공유 버튼</b>(⬆️) 탭<br>
      2. <b>홈 화면에 추가</b> 선택<br>
      3. 홈 화면의 <b>알림 설정</b> 아이콘 열기<br>
      4. <b>알림 허용</b> 버튼 탭
    </div>
  </div>

  <div id="view-success" class="hidden">
    <div class="icon">✅</div>
    <div class="title">알림이 켜졌어요</div>
    <div class="msg" id="success-msg">이제 출근/퇴근 알림을 받을 수 있습니다.</div>
  </div>

  <div id="view-error" class="hidden">
    <div class="icon">❌</div>
    <div class="title">설정 실패</div>
    <div class="msg" id="error-msg"></div>
    <button class="btn" onclick="enable()">다시 시도</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>
<script>
  var FIREBASE_CONFIG = {
    apiKey:            'AIzaSyAFjZebURTifQwSLoyUNMRsMc7xqIyH5ns',
    authDomain:        'unies-3f7f1.firebaseapp.com',
    projectId:         'unies-3f7f1',
    storageBucket:     'unies-3f7f1.firebasestorage.app',
    messagingSenderId: '318867913430',
    appId:             '1:318867913430:web:19280fa7cf1d34cc292777'
  };
  var VAPID_KEY = 'BNRlTGHuoe7AMLGB9F8isNeUGWSYNDt1Df7A9utRBDdAgDLqEfPu5doFJ6DGq06MZtL7o1PZoZZq2XSGwvuNTYI';

  var params = new URLSearchParams(location.search);
  var isIOS  = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  var isStandalone = (window.navigator.standalone === true) ||
                     window.matchMedia('(display-mode: standalone)').matches;
  var hasOpener = !!window.opener;

  // 아이폰 등록용 코드/실행URL — 최초 로드시 저장, 재실행시 재사용
  var reg  = params.get('reg')  || localStorage.getItem('fcm_reg')  || '';
  var exec = params.get('exec') || localStorage.getItem('fcm_exec') || '';
  if (params.get('reg'))  localStorage.setItem('fcm_reg',  params.get('reg'));
  if (params.get('exec')) localStorage.setItem('fcm_exec', params.get('exec'));

  function show(id) {
    ['view-loading','view-prompt','view-install','view-success','view-error']
      .forEach(function(v){ document.getElementById(v).classList.add('hidden'); });
    document.getElementById(id).classList.remove('hidden');
  }
  function fail(m){ document.getElementById('error-msg').textContent = m; show('view-error'); }

  function getToken() {
    firebase.initializeApp(FIREBASE_CONFIG);
    var messaging = firebase.messaging();
    return navigator.serviceWorker.register('firebase-messaging-sw.js')
      .then(function(swReg){
        return messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: swReg });
      });
  }

  function enable() {
    show('view-loading');
    if (!('Notification' in window) || !('serviceWorker' in navigator)) {
      fail('이 브라우저는 웹 알림을 지원하지 않습니다.'); return;
    }
    Notification.requestPermission().then(function(perm){
      if (perm !== 'granted') { fail('알림 권한이 거부되었습니다. 브라우저 설정에서 허용해 주세요.'); return; }
      getToken().then(function(token){
        if (!token) { fail('토큰 발급에 실패했습니다.'); return; }
        deliver(token);
      }).catch(function(e){ fail((e && e.message) || '토큰 발급 오류'); });
    }).catch(function(e){ fail((e && e.message) || '권한 요청 오류'); });
  }

  function deliver(token) {
    var ua = navigator.userAgent.substring(0, 60);
    if (hasOpener) {
      // 안드로이드/PC — 팝업: 앱(opener)으로 토큰 전달
      window.opener.postMessage({ source: 'fcm', ok: true, fcmToken: token, ua: ua }, '*');
      show('view-success');
      setTimeout(function(){ window.close(); }, 1500);
    } else {
      // 아이폰 홈화면(standalone) — GAS로 직접 저장
      if (!reg || !exec) { fail('등록 정보가 없습니다. 앱에서 다시 링크를 열어 주세요.'); return; }
      var url = exec + '?action=fcmreg&reg=' + encodeURIComponent(reg) +
                '&t=' + encodeURIComponent(token) + '&ua=' + encodeURIComponent(ua);
      fetch(url, { method: 'GET', mode: 'no-cors' }).then(function(){
        show('view-success');
      }).catch(function(){
        // no-cors라 응답을 못 읽어도 요청은 전달됨 — 낙관적 성공
        show('view-success');
      });
    }
  }

  window.addEventListener('load', function(){
    // 아이폰인데 홈화면 설치 상태가 아니면 → 설치 안내
    if (isIOS && !isStandalone && !hasOpener) { show('view-install'); return; }
    show('view-prompt');
  });
</script>
</body>
</html>
